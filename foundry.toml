[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200

# Aevum testnet (QDay Aevum, chain ID 44005) — see README.md for deployment.
[rpc_endpoints]
aevum = "https://rpc-test.qday.info"

